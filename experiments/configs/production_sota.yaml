# SOTA Enterprise Production Model Configuration
# High-capacity Bidirectional Encoder + Multi-Head Scaled Dot-Product Attention + Copy-Attention Mechanism
# Optimized for real-time inference on NVIDIA RTX 4060 GPU

data:
  train_sources:
    - {path: data/processed/train_comprehensive.jsonl, weight: 1.0}
  valid_path: data/processed/valid_comprehensive.jsonl
  max_src_len: 160
  max_tgt_len: 160

model:
  type: rnn
  rnn_type: gru
  attention: scaled_dot
  emb_dim: 128
  hid_dim: 256
  enc_layers: 2
  dec_layers: 1
  dropout: 0.2
  attn_dim: 128
  use_copy: true

train:
  run_name: production_sota
  batch_size: 64
  lr: 0.002
  epochs: 10
  patience: 3
  eval_every: 1
  eval_samples: 300
  mixed_precision: true
  label_smoothing: 0.05
  grad_clip: 1.0
  tf_ratio_start: 1.0
  tf_ratio_end: 0.8
